<style>
html.cml-atmo-on{background:#123c54!important}
.cml-atmo-on body{background:transparent!important;isolation:isolate}
#cml-atmo-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.cml-atmo-on #cml-previsioni{background:transparent!important;box-shadow:none!important;overflow:visible!important}
.cml-atmo-on #cml-previsioni::before,.cml-atmo-on #cml-previsioni::after{display:none!important;animation:none!important}
.cml-atmo-on .cml-home-hero{background:linear-gradient(125deg,#062638e8,#0b455be6)!important;box-shadow:0 18px 44px #001a2a30}
.cml-atmo-on .cml-home-hero .cml-hero-visual,.cml-atmo-on .cml-home-hero .cml-lab{display:none!important}
.cml-atmo-on .cml-home-hero.cml-living{display:block!important;min-height:0!important}
.cml-atmo-on .cml-current,.cml-atmo-on .cml-day-card,.cml-atmo-on .cml-marine-box,.cml-atmo-on .cml-nowcast-box,.cml-atmo-on .cml-radar-box,.cml-atmo-on #cml-explorer:not(.ex-dark){background:#fffffff5!important;box-shadow:0 12px 35px #001c3530}
#cml-atmo-tools{position:relative;z-index:8;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;margin:0 0 15px;padding:12px 16px;border:1px solid #ffffff40;border-radius:18px;background:#082b40ed;color:#f0f9ff;font:12px/1.6 system-ui;box-shadow:0 8px 24px #001b3530}
#cml-atmo-tools span{flex:1 1 300px}#cml-atmo-tools label{display:flex;align-items:center;gap:7px;cursor:pointer}#cml-atmo-tools input{accent-color:#7bdec7}#cml-atmo-tools button{border:1px solid #ffffff45;background:#1a4a60;color:white;border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}#cml-atmo-tools :focus-visible{outline:3px solid #ffd888;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.cml-atmo-on .cml-hero-glow,.cml-atmo-on .cml-brand-mark{animation:none!important}}
</style>
<script>
(()=>{
'use strict';
const payload=__ATMO_DATA__;
function init(){
 if(document.getElementById('cml-atmo-canvas'))return;
 const canvas=document.createElement('canvas');canvas.id='cml-atmo-canvas';canvas.setAttribute('aria-hidden','true');document.body.prepend(canvas);
 const ctx=canvas.getContext('2d');if(!ctx){canvas.remove();return}
 document.documentElement.classList.add('cml-atmo-on');
 const tools=document.createElement('div');tools.id='cml-atmo-tools';
 tools.innerHTML='<span id="atmo-status"></span><label><input id="atmo-follow" type="checkbox">Segui l’ora selezionata</label><button type="button" id="atmo-motion" aria-pressed="false">Pausa movimento</button><button type="button" id="atmo-visible" aria-pressed="true">Sfondo attivo</button>';
 canvas.after(tools);
 const $=id=>document.getElementById('atmo-'+id);
 let current=payload.current||{},selected=current,w=1000,h=700,t=0,last=0,raf=0;
 const mq=matchMedia('(prefers-reduced-motion: reduce)');let paused=mq.matches,enabled=true;
 const stars=Array.from({length:80},(_,i)=>({x:((i*73.73)%100)/100,y:((i*31.31)%70)/100,r:.5+(i%3)*.4}));
 const num=v=>v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))?Number(v):null;
 function clock(value){const m=String(value||'').match(/T(\d{2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}
 function sky(){
 const stamp=String(selected.time||''),day=payload.daily.find(r=>String(r.time).slice(0,10)===stamp.slice(0,10));
 const minute=clock(stamp),rise=day?clock(day.sunrise):null,set=day?clock(day.sunset):null;
 let light='unknown',progress=.5;
 if(minute!==null&&rise!==null&&set!==null){light=minute>=rise&&minute<set?'day':'night';if(Math.abs(minute-rise)<=45||Math.abs(minute-set)<=45)light='twilight';progress=Math.max(0,Math.min(1,(minute-rise)/(set-rise||1)))}
 const code=num(selected.weather_code),cloud=num(selected.cloud_cover),precip=num(selected.precipitation),wind=num(selected.wind_speed_10m);
 const snow=[71,73,75,77,85,86].includes(code),rain=[51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code),storm=[95,96,99].includes(code),fog=[45,48].includes(code);
 return {light,progress,code,cloud:cloud===null?([2,3].includes(code)?80:35):Math.max(0,Math.min(100,cloud)),wind:wind===null?10:Math.max(0,Math.min(100,wind)),snow,rain,storm,fog,amount:precip===null?.2:Math.max(0,Math.min(1,precip/5)),valid:code!==null||cloud!==null};
 }
 let scene=sky();
 function status(future=false){const time=String(selected.time||'');const date=time.slice(0,10).split('-').reverse().join('/');$('status').textContent=payload.place+' · '+(future?'Scenario previsto':'Condizioni modellistiche current')+' · '+(time?date+' '+time.slice(11,16):'orario non disponibile')+' · Europe/Rome'+(!scene.valid?' · dati insufficienti: sfondo neutro':'')+(scene.light==='unknown'?' · luce neutra, dati astronomici mancanti':'')}
 function update(){
 let future=false;selected=current;
 if($('follow').checked){const day=document.getElementById('ex-day'),slider=document.getElementById('ex-slider');if(day&&slider){const list=payload.hourly.filter(r=>String(r.time).slice(0,10)===day.value);if(list[Number(slider.value)]){selected=list[Number(slider.value)];future=true}}}
 scene=sky();status(future);draw();
 }
 function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
 function draw(){
 if(!enabled)return;const s=scene,night=s.light==='night',twilight=s.light==='twilight',neutral=!s.valid||s.light==='unknown';
 const colors=neutral?['#264a60','#7b9bac']:night?['#06172f','#294965']:twilight?['#343b65','#cf9785']:['#1c78a6','#9bdbe6'];
 const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,colors[0]);bg.addColorStop(1,colors[1]);ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
 if(night&&!neutral)stars.forEach((a,i)=>circle(a.x*w,a.y*h,a.r,'rgba(236,248,255,'+((.4+.22*Math.sin(t*.6+i))*(1-s.cloud/115))+')'));
 if(!neutral&&!s.fog){const x=w*(.12+.76*(night?.75:s.progress)),y=h*(.34-.2*Math.sin(Math.PI*(night?.75:s.progress)));const g=ctx.createRadialGradient(x,y,0,x,y,130);g.addColorStop(0,night?'#deeeff66':'#ffe5bbaa');g.addColorStop(1,'#ffffff00');ctx.globalAlpha=Math.max(.1,1-s.cloud/110);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);circle(x,y,night?20:29,night?'#e0edfa':'#ffe5ad');if(night)circle(x+9,y-6,17,colors[0]);ctx.globalAlpha=1}
 const count=Math.round(s.cloud/7);for(let i=0;i<count;i++){const size=110+(i%4)*45,x=((i*.187*w+t*(2+s.wind*.13))%(w+size*4))-size*2,y=h*(.1+(i%5)*.07);ctx.beginPath();ctx.ellipse(x,y,size,23,0,0,Math.PI*2);ctx.ellipse(x-size*.3,y-13,size*.44,38,0,0,Math.PI*2);ctx.ellipse(x+size*.24,y-16,size*.4,42,0,0,Math.PI*2);ctx.fillStyle=night?'#7389a440':s.storm?'#34495990':'#eef5f779';ctx.fill()}
 if(s.storm){ctx.fillStyle='#071b3555';ctx.fillRect(0,0,w,h)}
 for(let layer=0;layer<3;layer++){ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w+6;x+=6){const y=h*(.86+layer*.035)-Math.sin(x/w*7+layer*1.6)*h*.035-Math.sin(x/w*16+layer)*h*.014;ctx.lineTo(x,y)}ctx.lineTo(w,h);ctx.closePath();ctx.fillStyle=night?['#1f3d53','#19384b','#123144'][layer]:['#426b75','#315d60','#214c51'][layer];ctx.fill()}
 if(payload.coastal){const sea=h*.94;ctx.fillStyle=night?'#09283c':'#14566b';ctx.fillRect(0,sea,w,h-sea);for(let j=0;j<5;j++){ctx.beginPath();for(let x=0;x<=w;x+=8){const y=sea+8+j*10+Math.sin(x*.015+t*(.6+s.wind*.01)+j)*2;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle='#bcebf333';ctx.stroke()}}
 if(s.rain&&!s.snow){ctx.beginPath();ctx.strokeStyle='#daf3ff60';ctx.lineWidth=1;const n=Math.round(30+s.amount*170);for(let i=0;i<n;i++){const x=(i*91.31+t*(12+s.wind))%(w+70)-35,y=(i*67.73+t*220)%(h+30)-15;ctx.moveTo(x,y);ctx.lineTo(x-3-s.wind*.08,y+13)}ctx.stroke()}
 if(s.snow){const n=Math.round(35+s.amount*100);for(let i=0;i<n;i++){const x=(i*93.3+t*(6+s.wind*.1)+Math.sin(t+i)*12)%(w+30)-15,y=(i*63.7+t*(18+i%7))%(h+20)-10;circle(x,y,1+(i%3)*.6,'#f2faffb0')}}
 if(s.fog){for(let i=0;i<5;i++){const y=h*(.2+i*.16)+Math.sin(t*.15+i)*16;const g=ctx.createLinearGradient(0,y-45,0,y+45);g.addColorStop(0,'#e9f4f500');g.addColorStop(.5,'#e9f4f54d');g.addColorStop(1,'#e9f4f500');ctx.fillStyle=g;ctx.fillRect(0,y-45,w,90)}}
 }
 function resize(){w=window.innerWidth;h=window.innerHeight;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);draw()}
 function halt(){if(raf)cancelAnimationFrame(raf);raf=0;last=0}
 function frame(now){raf=0;if(paused||!enabled||document.hidden){last=0;return}if(last)t+=Math.min((now-last)/1000,.05);last=now;draw();raf=requestAnimationFrame(frame)}
 function start(){if(!raf&&!paused&&enabled&&!document.hidden)raf=requestAnimationFrame(frame)}
 function motionUI(){$('motion').textContent=paused?'Avvia movimento':'Pausa movimento';$('motion').setAttribute('aria-pressed',String(paused))}
 $('motion').onclick=()=>{paused=!paused;motionUI();paused?halt():start()};
 $('visible').onclick=()=>{enabled=!enabled;canvas.style.display=enabled?'block':'none';document.documentElement.classList.toggle('cml-atmo-on',enabled);$('visible').textContent=enabled?'Sfondo attivo':'Sfondo disattivato';$('visible').setAttribute('aria-pressed',String(enabled));if(enabled){resize();start()}else halt()};
 $('follow').onchange=update;
 const slider=document.getElementById('ex-slider'),day=document.getElementById('ex-day'),time=document.getElementById('ex-time');
 if(slider&&day){document.addEventListener('input',e=>{if(e.target===slider)update()});day.addEventListener('change',update);if(time)new MutationObserver(()=>{if($('follow').checked)update()}).observe(time,{childList:true,characterData:true,subtree:true})}
 else{$('follow').disabled=true;$('follow').parentElement.title='Richiede il pannello Il meteo, ora per ora'}
 window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>document.hidden?halt():start());
 mq.addEventListener('change',e=>{if(e.matches){paused=true;motionUI();halt();draw()}});
 motionUI();update();resize();start();
}
// La dashboard dell'app si inizializza prima dello sfondo.
function schedule(){setTimeout(init,0)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
})();
</script>
